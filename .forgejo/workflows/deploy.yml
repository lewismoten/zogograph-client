name: Deploy Zogograph Client

on:
  push:
    branches:
      - develop
    paths:
      - '**'
  workflow_dispatch:

concurrency:
  group: zogograph-client-lifecycle
  cancel-in-progress: true

jobs:
  test:
    name: Test PHP ${{ matrix.php }}
    runs-on: zogograph-ci
    container:
      # Forgejo Runner v13 requires credentials to be declared explicitly for
      # private job images; the runner pulls this image before any step runs.
      image: git.lewismoten.com/zogograph/runner-image:php-${{ matrix.php }}
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    # Container setup and dependency restoration count toward this ceiling.
    # Keep the job within the project-wide two-minute maximum.
    timeout-minutes: 2
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify bundled PHP and Node runtimes
        shell: bash
        run: |
          set -euo pipefail
          php --version
          node --version
          npm --version

      - name: Install Node dependencies
        shell: bash
        run: timeout 1m npm ci

      - name: Test PHP ${{ matrix.php }} compatibility
        shell: bash
        run: timeout 1m npm test

  build:
    name: Build release with PHP 8.5
    runs-on: zogograph-ci
    needs: test
    container:
      image: git.lewismoten.com/zogograph/runner-image:php-8.5
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    timeout-minutes: 2

    env:
      BROWSER_REFRESH_REQUIRED: ${{ vars.BROWSER_REFRESH_REQUIRED }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify bundled PHP and Node runtimes
        shell: bash
        run: |
          set -euo pipefail
          php --version
          node --version
          npm --version

      - name: Install Node dependencies
        shell: bash
        run: timeout 1m npm ci

      - name: Build
        shell: bash
        run: timeout 1m npm run build

      - name: Assemble release
        shell: bash
        run: |
          set -euo pipefail
          command -v rsync >/dev/null || { timeout 1m apt-get update; timeout 1m apt-get install -y rsync; }
          release=zogograph-release
          mkdir -p "$release"
          timeout 1m rsync -a --delete \
            --exclude='.git/' \
            --exclude='zogograph-release/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='data/***' \
            --exclude='lib/config.php' \
            --exclude='tests/' \
            --exclude='deploy/' \
            --exclude='*.md' \
            ./ "$release/"

      - name: Create build manifest
        shell: bash
        run: |
          set -euo pipefail
          release=zogograph-release
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          version="$(git describe --tags --always)"
          package_version="$(node -e 'process.stdout.write(require("./package.json").version)')"
          test -n "$package_version"
          case "${BROWSER_REFRESH_REQUIRED:-}" in ''|false) browser_refresh_required=false;; true) browser_refresh_required=true;; *) echo 'BROWSER_REFRESH_REQUIRED must be true or false.' >&2; exit 1;; esac
          cat > "$release/build.json" <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF_NAME}",
            "runId": "${GITHUB_RUN_ID}",
            "runNumber": "${GITHUB_RUN_NUMBER}",
            "createdAt": "${created_at}",
            "version": "${version}",
            "packageVersion": "${package_version}",
            "repo": "${GITHUB_REPOSITORY}",
            "application": "Zogograph",
            "part": "client",
            "browserRefreshRequired": ${browser_refresh_required}
          }
          EOF
          cat "$release/build.json"

      - name: Upload deployment build
        shell: bash
        run: |
          set -euo pipefail
          test -s zogograph-release/build.json
          test -n "$(find zogograph-release -type f -print -quit)"

      - name: Upload deployment build artifact
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: deployment-build
          path: zogograph-release/
          retention-days: 1

  deploy:
    name: Deploy to ${{ matrix.deploy_url }}
    runs-on: zogograph-ci
    container:
      image: git.lewismoten.com/zogograph/runner-image:php-8.5
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    # Prevent a stalled network operation from monopolizing a runner.
    timeout-minutes: 2
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - environment: test
            deploy_path: ${{ vars.TEST_PATH }}
            deploy_url: ${{ vars.TEST_URL }}

          - environment: client
            deploy_path: ${{ vars.DEPLOY_PATH }}
            deploy_url: ${{ vars.DEPLOY_URL }}

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ matrix.deploy_path }}
      DEPLOY_URL: ${{ matrix.deploy_url }}
      DEPLOY_TARGET: ${{ matrix.environment }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      SNAPSHOT_PATH: ${{ format('{0}/{1}', vars.SNAPSHOT_PATH, matrix.environment) }}
      SNAPSHOT_RETENTION: ${{ vars.SNAPSHOT_RETENTION }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

    steps:
      # Deployment scripts are checked out separately from the application
      # artifact so this job never rebuilds the release.
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Download deployment build
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: deployment-build
          path: zogograph-release/

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for setting in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_URL DEPLOY_KNOWN_HOSTS SNAPSHOT_PATH DEPLOY_SSH_PRIVATE_KEY; do
            test -n "${!setting}" || { echo "Missing required deployment setting: $setting"; exit 1; }
          done
          for setting in DEPLOY_PATH SNAPSHOT_PATH; do
            case "${!setting}" in /*) ;; *) echo "$setting must be an absolute path." >&2; exit 1;; esac
            case "${!setting}" in *[!A-Za-z0-9._/-]*) echo "$setting contains an unsafe character." >&2; exit 1;; esac
          done
          case "${SNAPSHOT_RETENTION:-3}" in *[!0-9]*|'') echo 'SNAPSHOT_RETENTION must be a whole number.' >&2; exit 1;; esac
          [ "${SNAPSHOT_RETENTION:-3}" -ge 1 ] && [ "${SNAPSHOT_RETENTION:-3}" -le 50 ] || { echo 'SNAPSHOT_RETENTION must be between 1 and 50.' >&2; exit 1; }
          test -f package.json

      - name: Resolve repository snapshot directory
        shell: bash
        run: |
          set -euo pipefail
          snapshot_repository="${GITHUB_REPOSITORY##*/}"
          case "$snapshot_repository" in ''|*[!A-Za-z0-9._-]*) echo 'Repository name is unsafe for the snapshot path.' >&2; exit 1;; esac
          printf 'SNAPSHOT_DIRECTORY=%s/%s\n' "${SNAPSHOT_PATH%/}" "$snapshot_repository" >> "$GITHUB_ENV"

      - name: Install SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/zogograph_deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/zogograph_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Install rsync
        shell: bash
        run: |
          set -euo pipefail
          command -v rsync >/dev/null || { timeout 1m apt-get update; timeout 1m apt-get install -y rsync; }

      - name: Snapshot the live site and SQLite databases
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          printf 'id=%s\n' "$snapshot_id" >> "$GITHUB_OUTPUT"
          remote_script=".zogograph-snapshot-${GITHUB_RUN_ID}-${DEPLOY_TARGET}.sh"
          timeout 1m ssh -i "$HOME/.ssh/zogograph_deploy_key" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '$SNAPSHOT_DIRECTORY'"
          timeout 1m rsync -az \
            -e "ssh -i $HOME/.ssh/zogograph_deploy_key -p ${DEPLOY_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes" \
            .forgejo/scripts/zogograph-snapshot.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_script}"
          timeout 1m ssh -i "$HOME/.ssh/zogograph_deploy_key" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash '$remote_script' '$DEPLOY_PATH' '$SNAPSHOT_DIRECTORY' '$snapshot_id' && rm -f '$remote_script'"

      - name: Upload application files
        shell: bash
        run: |
          set -euo pipefail
          timeout 1m rsync -az --delete \
            --exclude='data/***' \
            --exclude='lib/config.php' \
            --exclude='.well-known/' \
            -e "ssh -i $HOME/.ssh/zogograph_deploy_key -p ${DEPLOY_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes" \
            zogograph-release/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Verify deployed build
        shell: bash
        run: |
          set -euo pipefail
          build_url="${DEPLOY_URL%/}/build.json"
          for attempt in 1 2 3 4 5; do
            deployed="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "${build_url}?run=${GITHUB_RUN_ID}" | sed -n 's/.*"commit": "\([^"]*\)".*/\1/p')" || deployed=''
            [ "$deployed" = "$GITHUB_SHA" ] && exit 0
            echo "Attempt $attempt did not return ${GITHUB_SHA}."
            sleep 5
          done
          exit 1

      - name: Retain recent complete snapshots
        shell: bash
        run: |
          set -euo pipefail
          remote_script=".zogograph-snapshot-prune-${GITHUB_RUN_ID}-${DEPLOY_TARGET}.sh"
          timeout 1m rsync -az \
            -e "ssh -i $HOME/.ssh/zogograph_deploy_key -p ${DEPLOY_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes" \
            .forgejo/scripts/zogograph-snapshot-prune.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_script}"
          timeout 1m ssh -i "$HOME/.ssh/zogograph_deploy_key" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash '$remote_script' '$SNAPSHOT_DIRECTORY' '${SNAPSHOT_RETENTION:-3}' && rm -f '$remote_script'"

      - name: Report snapshot
        run: 'echo "Pre-deploy snapshot: ${{ steps.snapshot.outputs.id }}"'
